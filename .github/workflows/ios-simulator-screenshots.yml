name: iOS Simulator Tests and Screenshots

# Runs the native app's unit tests in the iOS Simulator, then captures
# portrait and landscape screenshots. Prefers an iPhone Duo simulator when the
# runner's Xcode has one, otherwise the first available iPhone.
# Repo is public (2026-11-17): macOS minutes are free. Runs when the native app changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ios-native/**
      - .github/workflows/ios-simulator-screenshots.yml

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd ios-native && xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          LIST=$(xcrun simctl list devices available)
          UDID=$(echo "$LIST" | grep -E 'iPhone Duo' | head -n 1 | grep -oE '[0-9A-F-]{36}' || true)
          [ -z "$UDID" ] && UDID=$(echo "$LIST" | grep -E 'iPhone 1[5-9] Pro \(' | head -n 1 | grep -oE '[0-9A-F-]{36}' || true)
          [ -z "$UDID" ] && UDID=$(echo "$LIST" | grep -E 'iPhone' | head -n 1 | grep -oE '[0-9A-F-]{36}')
          echo "$LIST" | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          cd ios-native
          xcodebuild test -project OpenTokenUsage.xcodeproj \
            -scheme OpenTokenUsage \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO | tail -n 60

      - name: Screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -e
          APP=ios-native/build/DerivedData/Build/Products/Debug-iphonesimulator/OpenTokenUsage.app
          BUNDLE=com.chihfu.opentokenusage
          mkdir -p screenshots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true

          shoot () {
            local app="$1" name="$2" appearance="$3"
            xcrun simctl ui "$UDID" appearance "$appearance"
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            xcrun simctl uninstall "$UDID" "$BUNDLE" || true
            xcrun simctl install "$UDID" "$app"
            # Unsigned layout: four 未設定 rows, no sample figures.
            xcrun simctl launch "$UDID" "$BUNDLE"
            sleep 12
            capture "$name"
          }

          # iPhone Duo has two displays (outer, inner); capture each one it reports.
          capture () {
            local name="$1" err displays
            if err=$(xcrun simctl io "$UDID" screenshot "screenshots/$name.png" 2>&1); then return 0; fi
            displays=$(echo "$err" | grep -oE -- '--display=[0-9]+' | cut -d= -f2 | sort -u)
            [ -n "$displays" ] || { echo "$err"; return 1; }
            for d in $displays; do
              xcrun simctl io "$UDID" screenshot --display="$d" "screenshots/$name-display$d.png"
            done
          }

          only_orientation () {
            local src="$1" dst="$2" orientation="$3"
            rm -rf "$dst"; mkdir -p "$(dirname "$dst")"; cp -R "$src" "$dst"
            /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$dst/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$dst/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string $orientation" "$dst/Info.plist"
            codesign --force --deep -s - "$dst"
          }

          shoot "$APP" portrait-dark dark
          shoot "$APP" portrait-light light
          only_orientation "$APP" "$RUNNER_TEMP/Land/OpenTokenUsage.app" UIInterfaceOrientationLandscapeLeft
          shoot "$RUNNER_TEMP/Land/OpenTokenUsage.app" landscape-dark dark
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: screenshots/
          retention-days: 14
