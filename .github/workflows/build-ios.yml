name: Build iOS IPA (Cloud Mac)

# Builds the native SwiftUI app in ios-native/ (no web view) as an unsigned IPA.
on:
  workflow_dispatch:
  push:
    branches: [ main, "work/**", "cursor/**" ]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios-native && xcodegen generate

      - name: Unsigned Release build and IPA
        run: |
          cd ios-native
          xcodebuild -project OpenTokenUsage.xcodeproj \
            -scheme OpenTokenUsage \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/OpenTokenUsage.app build/Payload/
          cd build && zip -qr OpenTokenUsage.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenTokenUsage-iOS-Release
          path: ios-native/build/OpenTokenUsage.ipa
          retention-days: 14
