name: Build iOS IPA (Cloud Mac)

on:
  workflow_dispatch:
  push:
    branches: [ main, "work/**" ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 檢出代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設置 Node.js 環境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝依賴與前端打包 (Build Web Assets)
        run: |
          npm ci
          npm run build

      - name: Capacitor iOS 資產同步 (Sync Capacitor iOS)
        run: |
          npx cap sync ios

      - name: 執行 xcodebuild 無簽名構建 (Unsigned Build & Package IPA)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/App.app build/Payload/
          if [ -d "App/Settings.bundle" ]; then
            cp -r App/Settings.bundle build/Payload/App.app/
          fi
          cd build && zip -r OpenTokenUsage.ipa Payload

      - name: 上傳 IPA 產出物 (Upload IPA Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenTokenUsage-iOS-Release
          path: ios/App/build/OpenTokenUsage.ipa
          retention-days: 14
