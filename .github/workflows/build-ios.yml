name: Build iOS IPA (native, unsigned)

# Builds ios-native/ as an unsigned .ipa for sideloading with a free Apple ID (plan D9).
# The repo is public, so macOS minutes are free.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "ios-native/**", ".github/workflows/build-ios.yml" ]
  pull_request:
    paths: [ "ios-native/**", ".github/workflows/build-ios.yml" ]

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd ios-native && xcodegen generate

      - name: Unsigned Release build and IPA
        run: |
          cd ios-native
          xcodebuild -project OpenTokenUsage.xcodeproj \
            -scheme OpenTokenUsage \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/OpenTokenUsage.app build/Payload/
          cd build && zip -qr OpenTokenUsage.ipa Payload
          ls -la OpenTokenUsage.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenTokenUsage-unsigned-ipa
          path: ios-native/build/OpenTokenUsage.ipa
          retention-days: 30
