name: iOS SDK probe (P1)

# Manual only (plan D7). Read-only; ~3 macOS minutes per image.
# 2026-11-17: the push-triggered run got no runner (jobs ended in 3-4 s, runner_id 0),
# matching the free-plan macOS minutes block reported in PR #4.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [xcode-27, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sdk-probe.sh
