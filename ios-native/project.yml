# Native SwiftUI app (no web view). Generate the Xcode project with:
#   brew install xcodegen && cd ios-native && xcodegen generate
name: OpenTokenUsage
options:
  bundleIdPrefix: com.chihfu
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenTokenUsage:
    type: application
    platform: iOS
    sources:
      - path: OpenTokenUsage
    info:
      path: OpenTokenUsage/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.chihfu.opentokenusage.refresh
        UIBackgroundModes:
          - fetch
    entitlements:
      path: OpenTokenUsage/OpenTokenUsage.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chihfu.opentokenusage
    dependencies:
      - target: OpenTokenUsageWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chihfu.opentokenusage
        PRODUCT_NAME: OpenTokenUsage
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenTokenUsage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
  OpenTokenUsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: OpenTokenUsage/Model
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: AI 額度
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/OpenTokenUsageWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chihfu.opentokenusage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chihfu.opentokenusage.widget
        PRODUCT_NAME: OpenTokenUsageWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  OpenTokenUsageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenTokenUsageTests
    dependencies:
      - target: OpenTokenUsage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenTokenUsage:
    build:
      targets:
        OpenTokenUsage: all
        OpenTokenUsageTests: [test]
    test:
      targets:
        - OpenTokenUsageTests
